[package]
name = "kimios"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kimios"
path = "src/main.rs"

[dependencies]
hermit-dtb = "0.1.1"
xmas-elf = "0.10.0"
spin = { version = "0.12.3", default-features = false, features = ["mutex", "spin_mutex"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "socket-dns",
    "socket-icmp",
    "alloc",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
