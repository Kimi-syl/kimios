name: NodeMobile smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "ios/node-smoke/**"
      - "tools/fetch-node-mobile.sh"
      - ".github/workflows/node-smoke.yml"

jobs:
  node-smoke:
    name: Boot Node 24 inside the iOS simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Fetch NodeMobile framework
        run: bash tools/fetch-node-mobile.sh
      - name: Generate project
        working-directory: ios/node-smoke
        run: xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild             -project ios/node-smoke/KimiNodeSmoke.xcodeproj             -scheme KimiNodeSmoke             -configuration Debug             -sdk iphonesimulator             -derivedDataPath ios/node-smoke/build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build
      - name: Launch and read marker
        run: |
          APP="ios/node-smoke/build/Build/Products/Debug-iphonesimulator/KimiNodeSmoke.app"
          DEVICE="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ {gsub(/^ +| +$/,"",$1); print $1; exit}')"
          echo "device=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.kimios.nodesmoke
          for i in $(seq 1 30); do
            DATA="$(xcrun simctl get_app_container "$DEVICE" com.kimios.nodesmoke data)"
            if [ -f "$DATA/Documents/smoke-js.txt" ] && [ -f "$DATA/Documents/smoke-result.txt" ]; then
              break
            fi
            sleep 1
          done
          DATA="$(xcrun simctl get_app_container "$DEVICE" com.kimios.nodesmoke data)"
          cat "$DATA/Documents/smoke-js.txt"
          cat "$DATA/Documents/smoke-result.txt"
          grep -q "js-ok" "$DATA/Documents/smoke-js.txt"
          grep -q "rc=" "$DATA/Documents/smoke-result.txt"
