name: iOS iSH smoke

# Runtime smoke for the embedded iSH Linux guest: builds iSH for the iOS
# Simulator, then actually boots the Alpine rootfs and runs commands in it via
# `simctl spawn`. This proves the emulator + rootfs execute (not just compile),
# mirroring how dsh-Go verifies its guest. Isolated from the IPA build.

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'ios/deps/**'
      - 'ios/app/Sources/KimiISH.*'
      - '.github/workflows/ios-ish-smoke.yml'

jobs:
  ish-smoke:
    name: Boot iSH guest in the iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install meson ninja llvm lld libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build iSH (simulator) + ish CLI
        run: bash ios/deps/build_ish.sh iphonesimulator --cli

      - name: Fetch + extract Alpine rootfs
        run: |
          curl -fL --retry 3 -o /tmp/alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.0-aarch64.tar.gz
          rm -rf /tmp/alpine && mkdir -p /tmp/alpine
          tar -xzf /tmp/alpine.tar.gz -C /tmp/alpine
          ls /tmp/alpine | head
          head -1 /tmp/alpine/etc/os-release

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for v in d.values() for x in v if x.get("isAvailable")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "booted $UDID"

      - name: Run guest commands (echo / os-release / ls)
        run: |
          ISH="$PWD/ios/deps/ish/build-ios-sim/ish"
          test -x "$ISH" || { echo "ish CLI missing"; exit 1; }
          UDID="${{ steps.sim.outputs.udid }}"
          set -x
          timeout 180 xcrun simctl spawn "$UDID" "$ISH" -r /tmp/alpine \
            /bin/sh -c 'echo HELLO_ISH; cat /etc/os-release | head -1; echo CWD=$(pwd); ls / | head; exit 7' \
            | tee /tmp/out.txt
          rc=${PIPESTATUS[0]}
          grep -q 'HELLO_ISH' /tmp/out.txt || { echo "guest did not run"; exit 1; }
          echo "guest exit status: $rc (expected 7)"