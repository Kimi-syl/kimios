name: iOS IPA

# Least privilege: checkout/build, plus actions: write for upload-artifact.
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - "user/libkimi/**"
      - "user/kimi-gui/**"
      - ".github/workflows/ios.yml"

jobs:
  build-ipa:
    name: Build KimiOS .ipa (library-OS, native ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install iSH build deps (meson, ninja, llvm, libarchive)
        run: |
          brew install meson ninja llvm lld libarchive pkg-config
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: user

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          rustc --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build .ipa
        run: bash ios/build-ipa.sh

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KimiOS-iOS-ipa
          path: ios/build/KimiOS.ipa
          if-no-files-found: error

      - name: Upload .app (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KimiOS-app-debug
          path: ios/build/Build/Products/Release-iphoneos/KimiOS.app
          if-no-files-found: ignore
