name: Android libOS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "user/libkimi/**"
      - "user/kimi-gui/**"
      - ".github/workflows/android-libos.yml"

jobs:
  build-apk:
    name: Build KimiOS libOS APK (native ARM64, no QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK components (build-tools, platform, NDK)
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          echo "using $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909125"

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: user

      - name: Build APK
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/26.1.10909125"
          # Sign with the same debug key as the phone / frontend releases.
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kimios-debug.keystore"
            export KIMIOS_KEYSTORE="$RUNNER_TEMP/kimios-debug.keystore"
          fi
          bash android/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KimiOS-libOS-APK
          path: android/build/KimiOS-libos.apk
          if-no-files-found: error
