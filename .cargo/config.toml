[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=ld.lld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static",
]

# Allow a fallback list of DNS servers (smoltcp defaults to a single server).
[env]
SMOLTCP_DNS_MAX_SERVER_COUNT = "3"
