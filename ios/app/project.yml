name: KimiOS
options:
  bundleIdPrefix: com.kimios
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  KimiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: KimiosBridge.h
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimios.lite
        PRODUCT_NAME: KimiOS
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: KimiosBridge.h
        OTHER_LDFLAGS:
          - "$(SRCROOT)/libkimi_gui.a"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEAD_CODE_STRIPPING: YES
    scheme: {}
