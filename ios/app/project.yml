name: KimiOS
options:
  bundleIdPrefix: com.kimios
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  KimiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: KimiosBridge.h
      - path: Resources/opencode
        type: folder
        buildPhase: resources
      - path: Resources/licenses
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: KimiOS
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "KimiOS uses your location for Weather and Maps."
        NSPhotoLibraryUsageDescription: "KimiOS imports photos and files you choose into its sandbox."
        NSLocalNetworkUsageDescription: "KimiOS connects to your Kimi PTY bridge for remote terminal sessions and its local OpenCode server."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        MinimumOSVersion: "15.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimios.lite
        PRODUCT_NAME: KimiOS
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: KimiosBridge.h
        OTHER_LDFLAGS:
          - "$(SRCROOT)/libkimi_gui.a"
          - "$(SRCROOT)/../deps/ish/build-ios/libish.a"
          - "$(SRCROOT)/../deps/ish/build-ios/libish_emu.a"
          - "$(SRCROOT)/../deps/ish/build-ios/libfakefs.a"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../deps/ish"
          - "$(SRCROOT)/../deps/ish/build-ios"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - framework: Vendor/NodeMobile.xcframework
        embed: true
    scheme: {}
